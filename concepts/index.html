<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation Concepts</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Title element that we will select and change -->
        <h1 id="main-title">DOM Manipulation Demo</h1>
        
        <!-- Paragraph whose content we will update -->
        <p id="description">The Document Object Model (DOM) represents the page structure as a tree of objects that JavaScript can modify.</p>
        
        <!-- Button that will trigger our click event listener -->
        <button id="action-btn">Click to Update DOM</button>
        
        <!-- Container where we will dynamically append new elements -->
        <div id="dynamic-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
